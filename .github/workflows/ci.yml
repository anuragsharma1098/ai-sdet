name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_environment:
        description: Target environment for web and API tests
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - prd

env:
  TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.test_environment || 'dev' }}

jobs:
  quality-and-tests:
    name: Quality and Playwright Tests (${{ github.event_name == 'workflow_dispatch' && inputs.test_environment || 'dev' }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: bash .devcontainer/install-system-deps.sh

      - name: Verify Java for Allure
        run: java -version

      - name: Install dependencies
        run: npm install

      - name: Show target environment
        run: echo "Running CI-safe web/API tests against TEST_ENV=${TEST_ENV}"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run web and API tests
        run: npm run test:${TEST_ENV}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_ENV }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.TEST_ENV }}
          path: test-results/
          if-no-files-found: ignore

      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.TEST_ENV }}
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.TEST_ENV }}
          path: allure-report/
          if-no-files-found: ignore
